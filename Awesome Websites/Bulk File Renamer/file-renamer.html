<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Renamer - Batch Rename Tool</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'%3E%3C/path%3E%3Cpolyline points='14 2 14 8 20 8'%3E%3C/polyline%3E%3Cpath d='M10.4 12.6a2 2 0 1 1 3 3L8 21l-4 1 1-4 5.4-5.4z'%3E%3C/path%3E%3C/svg%3E">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #242424;
            --accent: #10b981;
            --accent-dim: #059669;
            --accent-bright: #34d399;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --border: #2a2a2a;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, #121212 100%);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }
        
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            animation: fadeInDown 0.6s ease-out;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .header-title {
            flex: 1;
        }
        
        h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-bright), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.25rem;
            letter-spacing: -0.02em;
        }
        
        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .upload-buttons {
            display: flex;
            gap: 0.75rem;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'DM Sans', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-dim));
            color: var(--bg-primary);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
        }
        
        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover {
            background: var(--bg-secondary);
            border-color: var(--accent);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .controls {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: space-between;
            animation: fadeIn 0.6s ease-out 0.2s both;
        }
        
        .controls-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .sort-badge {
            background: var(--bg-tertiary);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }
        
        .sort-badge.active {
            background: linear-gradient(135deg, var(--accent), var(--accent-dim));
            color: var(--bg-primary);
        }
        
        .file-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
            animation: fadeIn 0.6s ease-out 0.3s both;
        }
        
        .file-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            position: relative;
        }
        
        .file-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        
        .file-card.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.3);
        }
        
        .file-card-preview {
            width: 100%;
            aspect-ratio: 1;
            position: relative;
            background: var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .file-card-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .file-card-checkbox {
            position: absolute;
            top: 0.75rem;
            left: 0.75rem;
            z-index: 10;
        }
        
        .file-card-index {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            background: rgba(0, 0, 0, 0.7);
            color: var(--text-primary);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            z-index: 10;
        }
        
        .file-card-info {
            padding: 1rem;
        }
        
        .file-card.compact .file-card-info {
            padding: 0.5rem;
        }
        
        .file-card-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            margin-bottom: 0.75rem;
            word-break: break-word;
            min-height: 2.4em;
            line-height: 1.2;
        }
        
        .file-card.compact .file-card-name {
            font-size: 0.7rem;
            margin-bottom: 0.5rem;
            min-height: 2em;
        }
        
        .file-card-name.renamed {
            color: var(--success);
        }
        
        .file-card-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        
        .file-card.compact .file-card-actions {
            gap: 0.25rem;
        }
        
        .file-card.compact .arrow-btn {
            height: 24px;
            font-size: 0.85rem;
        }
        
        .file-card.compact .file-card-index {
            font-size: 0.65rem;
            padding: 0.2rem 0.4rem;
        }
        
        .file-card.compact .checkbox {
            width: 16px;
            height: 16px;
        }
        
        .file-icon-large {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-dim), var(--accent));
            color: var(--bg-primary);
        }
        
        .checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--accent);
        }
        
        .arrow-btns {
            display: flex;
            gap: 0.25rem;
            flex: 1;
        }
        
        .arrow-btn {
            flex: 1;
            height: 32px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            font-size: 1rem;
        }
        
        .arrow-btn:hover:not(:disabled) {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }
        
        .arrow-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .rename-section {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border-top: 2px solid var(--accent);
            padding: 0.75rem 1.5rem;
            z-index: 100;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.4s ease-out;
        }
        
        .rename-section-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }
        
        .rename-section-spacer {
            height: 80px;
        }
        
        .rename-section h3 {
            font-size: 0.9rem;
            color: var(--accent);
            margin: 0;
            white-space: nowrap;
        }
        
        .rename-input-group {
            display: flex;
            gap: 0.5rem;
            flex: 1;
            min-width: 300px;
        }
        
        .rename-input {
            flex: 1;
            padding: 0.5rem 0.75rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.3s ease;
        }
        
        .rename-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }
        
        /* Hide number input spinners */
        .rename-input[type="number"]::-webkit-inner-spin-button,
        .rename-input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        .rename-input[type="number"] {
            -moz-appearance: textfield;
        }
        
        .preview-text {
            padding: 0.5rem 0.75rem;
            background: var(--bg-tertiary);
            border-radius: 6px;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            border: 1px solid var(--border);
            flex: 1;
            min-width: 250px;
        }
        
        .preview-text strong {
            color: var(--accent-bright);
        }
        
        .stats {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        .stat {
            display: flex;
            align-items: baseline;
            gap: 0.35rem;
        }
        
        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        
        .stat-value {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
        }
        
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }
        
        .empty-state svg {
            width: 120px;
            height: 120px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .download-section {
            text-align: center;
            animation: fadeIn 0.6s ease-out 0.5s both;
        }
        
        .btn-large {
            padding: 1rem 2rem;
            font-size: 1.1rem;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 1200px) {
            .file-list {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)) !important;
            }
            
            .file-list.compact-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)) !important;
            }
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 1.5rem;
            }
            
            .app-container {
                padding: 1rem;
            }
            
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .file-list {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)) !important;
                gap: 1rem;
            }
            
            .file-list.compact-grid {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)) !important;
            }
            
            .rename-section {
                padding: 0.75rem;
            }
            
            .rename-section-inner {
                flex-direction: column;
                align-items: stretch;
                gap: 0.75rem;
            }
            
            .stats {
                justify-content: space-between;
            }
            
            .rename-input-group, .preview-text {
                min-width: 100%;
            }
        }
        
        /*----------------Text Selection----------*/
        ::selection {
            background: var(--accent); /* WebKit/Blink Browsers */
            color: var(--bg-primary);
        }

        ::-moz-selection {
            background: var(--accent); /* Gecko Browsers */
            color: var(--bg-primary);
        }

        ::-ms-selection {
            background: var(--accent); /* IE 10+ */
            color: var(--bg-primary);
        }

        /*----------------Scrollbar----------*/
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
            transition: 1s;
        }

        ::-webkit-scrollbar-thumb {
            background-color: rgba(16, 185, 129, 0.4);
            background-clip: padding-box;
            border: 2px solid transparent;
            border-radius: 5px;
            transition: 1s;
        }

        ::-webkit-scrollbar-thumb:vertical:hover,
        ::-webkit-scrollbar-thumb:horizontal:hover {
            background-color: rgba(16, 185, 129, 0.6);
            transition: 0.3s;
        }

        ::-webkit-scrollbar-track {
            background-color: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb:vertical:active,
        ::-webkit-scrollbar-thumb:horizontal:active {
            background: rgba(16, 185, 129, 0.8);
        }

        ::-webkit-scrollbar-corner {
            background: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // ─── FilePreview lives OUTSIDE FileRenamer so React never remounts it ───────
        // Uses createObjectURL (lighter than base64 FileReader) with a module-level cache
        const objectUrlCache = {};

        const FilePreview = React.memo(({ fileId, originalFile, extension, currentName }) => {
            const [preview, setPreview] = useState(() => objectUrlCache[fileId] || null);

            useEffect(() => {
                if (objectUrlCache[fileId]) {
                    setPreview(objectUrlCache[fileId]);
                    return;
                }
                if (originalFile.type.startsWith('image/')) {
                    const url = URL.createObjectURL(originalFile);
                    objectUrlCache[fileId] = url;
                    setPreview(url);
                }
                // No revoke here – we intentionally keep the URL alive for fast re-use
            }, [fileId]);

            if (preview) {
                return <img src={preview} alt={currentName} loading="lazy" />;
            }
            const ext = extension.toUpperCase().replace('.', '') || '?';
            return <div className="file-icon-large">{ext}</div>;
        });

        // ─── Memoized card so it only re-renders when its own data changes ───────────
        const FileCard = React.memo(({ file, index, isSelected, isLast, compactView, onToggle, onMove }) => (
            <div className={`file-card ${isSelected ? 'selected' : ''} ${compactView ? 'compact' : ''}`}>
                <div className="file-card-preview">
                    <input
                        type="checkbox"
                        className="checkbox file-card-checkbox"
                        checked={isSelected}
                        onChange={() => onToggle(file.id)}
                    />
                    <div className="file-card-index">{index + 1}</div>
                    <FilePreview
                        fileId={file.id}
                        originalFile={file.originalFile}
                        extension={file.extension}
                        currentName={file.currentName}
                    />
                </div>
                <div className="file-card-info">
                    <div className={`file-card-name ${file.isRenamed ? 'renamed' : ''}`}>
                        {file.currentName}
                    </div>
                    <div className="file-card-actions">
                        <div className="arrow-btns">
                            <button
                                className="arrow-btn"
                                onClick={() => onMove(file.id, 'left')}
                                disabled={index === 0}
                                title="Move left"
                            >←</button>
                            <button
                                className="arrow-btn"
                                onClick={() => onMove(file.id, 'right')}
                                disabled={isLast}
                                title="Move right"
                            >→</button>
                        </div>
                    </div>
                </div>
            </div>
        ));

        // ─── Main component ───────────────────────────────────────────────────────────
        function FileRenamer() {
            const [files, setFiles] = useState([]);
            const [selectedIds, setSelectedIds] = useState(new Set());
            const [sortMode, setSortMode] = useState('date');
            const [sortDirection, setSortDirection] = useState('desc');
            const [renameInput, setRenameInput] = useState('');
            const [compactView, setCompactView] = useState(false);

            const fileInputRef = useRef(null);
            const folderInputRef = useRef(null);

            // ── Derived / memoized values ────────────────────────────────────────────
            const sortedFiles = useMemo(() => {
                let sorted = [...files];
                if (sortMode === 'name') {
                    sorted.sort((a, b) => {
                        const na = a.currentName.toLowerCase();
                        const nb = b.currentName.toLowerCase();
                        return sortDirection === 'asc'
                            ? na.localeCompare(nb, undefined, { numeric: true, sensitivity: 'base' })
                            : nb.localeCompare(na, undefined, { numeric: true, sensitivity: 'base' });
                    });
                } else if (sortMode === 'date') {
                    sorted.sort((a, b) => sortDirection === 'asc'
                        ? a.dateModified - b.dateModified
                        : b.dateModified - a.dateModified);
                } else if (sortMode === 'custom') {
                    sorted.sort((a, b) => a.order - b.order);
                }
                return sorted;
            }, [files, sortMode, sortDirection]);

            const renamedCount = useMemo(() => files.filter(f => f.isRenamed).length, [files]);

            const preview = useMemo(() => {
                if (selectedIds.size === 0 || !renameInput.trim()) {
                    return 'Select files and enter a name to see preview';
                }
                const sanitized = renameInput.replace(/[<>:"/\\|?*]/g, '');
                const sortedSelected = sortedFiles.filter(f => selectedIds.has(f.id));
                if (selectedIds.size === 1) {
                    return `${sanitized}${sortedSelected[0]?.extension ?? ''}`;
                }
                const previews = sortedSelected.slice(0, 3).map((file, idx) =>
                    `${sanitized} (${idx + 1})${file.extension}`
                );
                if (sortedSelected.length > 3) previews.push(`... and ${sortedSelected.length - 3} more`);
                return previews.join(', ');
            }, [selectedIds, renameInput, sortedFiles]);

            // ── Stable callbacks (prevent child re-renders) ──────────────────────────
            const handleFileUpload = useCallback((fileList) => {
                setFiles(prev => {
                    const newFiles = Array.from(fileList).map((file, index) => {
                        const nameParts = file.name.split('.');
                        const extension = nameParts.length > 1 ? '.' + nameParts.pop() : '';
                        return {
                            id: `file-${Date.now()}-${index}`,
                            originalFile: file,
                            originalName: file.name,
                            currentName: file.name,
                            nameWithoutExt: nameParts.join('.'),
                            extension,
                            size: file.size,
                            dateModified: file.lastModified,
                            isRenamed: false,
                            order: prev.length + index
                        };
                    });
                    return [...prev, ...newFiles];
                });
            }, []);

            const handleSort = useCallback((mode) => {
                setSortMode(prev => {
                    if (prev === mode) {
                        setSortDirection(d => d === 'asc' ? 'desc' : 'asc');
                        return prev;
                    }
                    setSortDirection(mode === 'date' ? 'desc' : 'asc');
                    return mode;
                });
            }, []);

            const toggleSelection = useCallback((id) => {
                setSelectedIds(prev => {
                    const next = new Set(prev);
                    if (next.has(id)) {
                        next.delete(id);
                    } else {
                        next.add(id);
                        if (next.size === 1) {
                            setFiles(fs => {
                                const file = fs.find(f => f.id === id);
                                if (file) setRenameInput(r => r.trim() ? r : file.nameWithoutExt);
                                return fs;
                            });
                        }
                    }
                    return next;
                });
            }, []);

            const selectAll = useCallback(() => {
                setFiles(fs => {
                    setSelectedIds(new Set(fs.map(f => f.id)));
                    setRenameInput(r => (fs.length > 0 && !r.trim()) ? fs[0].nameWithoutExt : r);
                    return fs;
                });
            }, []);

            const deselectAll = useCallback(() => setSelectedIds(new Set()), []);

            const handleRename = useCallback(() => {
                setFiles(prevFiles => {
                    if (!renameInput.trim() || selectedIds.size === 0) return prevFiles;
                    const sanitized = renameInput.replace(/[<>:"/\\|?*]/g, '');
                    // Sort once to determine order
                    let sorted = [...prevFiles];
                    if (sortMode === 'name') {
                        sorted.sort((a, b) => sortDirection === 'asc'
                            ? a.currentName.toLowerCase().localeCompare(b.currentName.toLowerCase(), undefined, { numeric: true, sensitivity: 'base' })
                            : b.currentName.toLowerCase().localeCompare(a.currentName.toLowerCase(), undefined, { numeric: true, sensitivity: 'base' }));
                    } else if (sortMode === 'date') {
                        sorted.sort((a, b) => sortDirection === 'asc' ? a.dateModified - b.dateModified : b.dateModified - a.dateModified);
                    } else {
                        sorted.sort((a, b) => a.order - b.order);
                    }
                    const sortedSelected = sorted.filter(f => selectedIds.has(f.id));
                    return prevFiles.map(file => {
                        const selectedIndex = sortedSelected.findIndex(f => f.id === file.id);
                        if (selectedIndex === -1) return file;
                        const newName = selectedIds.size === 1
                            ? `${sanitized}${file.extension}`
                            : `${sanitized} (${selectedIndex + 1})${file.extension}`;
                        return {
                            ...file,
                            currentName: newName,
                            nameWithoutExt: selectedIds.size === 1 ? sanitized : `${sanitized} (${selectedIndex + 1})`,
                            isRenamed: true
                        };
                    });
                });
                setRenameInput('');
            }, [renameInput, selectedIds, sortMode, sortDirection]);

            const moveFile = useCallback((id, direction) => {
                setSortMode('custom');
                setFiles(prevFiles => {
                    let sorted = [...prevFiles].sort((a, b) => a.order - b.order);
                    const index = sorted.findIndex(f => f.id === id);
                    if (index === -1) return prevFiles;
                    const newIndex = direction === 'left' ? index - 1 : index + 1;
                    if (newIndex < 0 || newIndex >= sorted.length) return prevFiles;
                    [sorted[index], sorted[newIndex]] = [sorted[newIndex], sorted[index]];
                    return sorted.map((file, idx) => ({ ...file, order: idx }));
                });
            }, []);

            const moveToIndex = useCallback((targetIndex) => {
                if (selectedIds.size === 0) return;
                setSortMode('custom');
                setFiles(prevFiles => {
                    let sorted = [...prevFiles].sort((a, b) => a.order - b.order);
                    const selectedFiles = sorted.filter(f => selectedIds.has(f.id));
                    const unselectedFiles = sorted.filter(f => !selectedIds.has(f.id));
                    const clampedIndex = Math.max(0, Math.min(targetIndex - 1, sorted.length - selectedFiles.length));
                    const reordered = [
                        ...unselectedFiles.slice(0, clampedIndex),
                        ...selectedFiles,
                        ...unselectedFiles.slice(clampedIndex)
                    ];
                    return reordered.map((file, idx) => ({ ...file, order: idx }));
                });
            }, [selectedIds]);

            const downloadSelected = useCallback(async () => {
                const selectedFiles = files.filter(f => selectedIds.has(f.id));
                if (selectedFiles.length === 0) return;
                const zip = new JSZip();
                selectedFiles.forEach(file => zip.file(file.currentName, file.originalFile));
                const content = await zip.generateAsync({ type: 'blob' });
                const url = URL.createObjectURL(content);
                const a = document.createElement('a');
                a.href = url;
                a.download = `renamed-files-${Date.now()}.zip`;
                a.click();
                URL.revokeObjectURL(url);
            }, [files, selectedIds]);

            // ── Render ───────────────────────────────────────────────────────────────
            return (
                <div className="app-container">
                    <header>
                        <div className="header-title">
                            <h1>File Renamer</h1>
                            <p className="subtitle">Batch rename files with precision and ease</p>
                        </div>
                        <div className="upload-buttons">
                            <button className="btn btn-primary" onClick={() => fileInputRef.current?.click()}>
                                📄 Select Files
                            </button>
                            <button className="btn btn-secondary" onClick={() => folderInputRef.current?.click()}>
                                📂 Select Folder
                            </button>
                        </div>
                    </header>

                    <input ref={fileInputRef} type="file" multiple onChange={(e) => handleFileUpload(e.target.files)} />
                    <input ref={folderInputRef} type="file" webkitdirectory="true" directory="true" multiple onChange={(e) => handleFileUpload(e.target.files)} />

                    {files.length > 0 && (
                        <>
                            <div className="controls">
                                <div className="controls-group">
                                    <span style={{color: 'var(--text-secondary)'}}>Sort:</span>
                                    <button className="btn btn-secondary" onClick={() => handleSort('name')}>
                                        Name {sortMode === 'name' && (sortDirection === 'asc' ? '↑' : '↓')}
                                    </button>
                                    <button className="btn btn-secondary" onClick={() => handleSort('date')}>
                                        Date {sortMode === 'date' && (sortDirection === 'asc' ? '↑' : '↓')}
                                    </button>
                                    <span className={`sort-badge ${sortMode === 'custom' ? 'active' : ''}`}>
                                        {sortMode === 'custom' ? '✓ Custom Order' : 'Custom'}
                                    </span>
                                </div>

                                <div className="controls-group">
                                    <button className="btn btn-secondary" onClick={selectAll}>Select All</button>
                                    <button className="btn btn-secondary" onClick={deselectAll}>Deselect All</button>
                                    <button className="btn btn-secondary" onClick={() => setCompactView(v => !v)}>
                                        {compactView ? '⊟ Compact' : '⊞ Normal'} View
                                    </button>
                                </div>

                                <div className="stats">
                                    <div className="stat">
                                        <div className="stat-label">Total:</div>
                                        <div className="stat-value">{files.length}</div>
                                    </div>
                                    <div className="stat">
                                        <div className="stat-label">Selected:</div>
                                        <div className="stat-value">{selectedIds.size}</div>
                                    </div>
                                    <div className="stat">
                                        <div className="stat-label">Renamed:</div>
                                        <div className="stat-value">{renamedCount}</div>
                                    </div>
                                </div>
                            </div>

                            <div className="file-list" style={{
                                gridTemplateColumns: compactView
                                    ? 'repeat(auto-fill, minmax(120px, 1fr))'
                                    : 'repeat(auto-fill, minmax(200px, 1fr))'
                            }}>
                                {sortedFiles.map((file, index) => (
                                    <FileCard
                                        key={file.id}
                                        file={file}
                                        index={index}
                                        isSelected={selectedIds.has(file.id)}
                                        isLast={index === sortedFiles.length - 1}
                                        compactView={compactView}
                                        onToggle={toggleSelection}
                                        onMove={moveFile}
                                    />
                                ))}
                            </div>

                            <div className="rename-section-spacer"></div>

                            <div className="rename-section">
                                <div className="rename-section-inner">
                                    <h3>Rename</h3>

                                    <div className="rename-input-group">
                                        <input
                                            type="text"
                                            className="rename-input"
                                            placeholder="Enter new filename..."
                                            value={renameInput}
                                            onChange={(e) => setRenameInput(e.target.value)}
                                            onKeyPress={(e) => { if (e.key === 'Enter') handleRename(); }}
                                        />
                                        <button
                                            className="btn btn-primary"
                                            onClick={handleRename}
                                            disabled={!renameInput.trim() || selectedIds.size === 0}
                                            style={{padding: '0.5rem 1rem'}}
                                        >Rename</button>
                                    </div>

                                    <div className="preview-text">
                                        <strong>Preview:</strong> {preview}
                                    </div>

                                    <div className="rename-input-group" style={{minWidth: '200px', maxWidth: '200px'}}>
                                        <input
                                            type="number"
                                            className="rename-input"
                                            placeholder="Move to index..."
                                            min="1"
                                            max={files.length}
                                            onKeyPress={(e) => {
                                                if (e.key === 'Enter' && e.target.value) {
                                                    moveToIndex(parseInt(e.target.value));
                                                    e.target.value = '';
                                                }
                                            }}
                                            disabled={selectedIds.size === 0}
                                        />
                                        <button
                                            className="btn btn-primary"
                                            onClick={(e) => {
                                                const input = e.target.previousElementSibling;
                                                if (input.value) { moveToIndex(parseInt(input.value)); input.value = ''; }
                                            }}
                                            disabled={selectedIds.size === 0}
                                            style={{padding: '0.5rem 1rem'}}
                                            title="Move selected files to this position"
                                        >Move</button>
                                    </div>

                                    <button
                                        className="btn btn-primary"
                                        onClick={downloadSelected}
                                        disabled={selectedIds.size === 0}
                                        style={{padding: '0.5rem 1rem', whiteSpace: 'nowrap'}}
                                    >
                                        📦 Download Selected ({selectedIds.size})
                                    </button>
                                </div>
                            </div>
                        </>
                    )}

                    {files.length === 0 && (
                        <div className="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                                <polyline points="13 2 13 9 20 9"></polyline>
                            </svg>
                            <h3>No files uploaded yet</h3>
                            <p>Upload files or folders to get started</p>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<FileRenamer />, document.getElementById('root'));
    </script>
</body>
</html>
