<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Renamer - Batch Rename Tool</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #151935;
            --bg-tertiary: #1e2441;
            --accent: #00d4ff;
            --accent-dim: #0099cc;
            --accent-bright: #4dffff;
            --text-primary: #e8edf4;
            --text-secondary: #8b95b0;
            --border: #2a3350;
            --success: #00ff88;
            --warning: #ffaa00;
            --danger: #ff4466;
        }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, #0d1129 100%);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }
        
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            animation: fadeInDown 0.6s ease-out;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .header-title {
            flex: 1;
        }
        
        h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-bright), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.25rem;
            letter-spacing: -0.02em;
        }
        
        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .upload-buttons {
            display: flex;
            gap: 0.75rem;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'DM Sans', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-dim));
            color: var(--bg-primary);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 212, 255, 0.3);
        }
        
        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover {
            background: var(--bg-secondary);
            border-color: var(--accent);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .controls {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: space-between;
            animation: fadeIn 0.6s ease-out 0.2s both;
        }
        
        .controls-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .sort-badge {
            background: var(--bg-tertiary);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }
        
        .sort-badge.active {
            background: linear-gradient(135deg, var(--accent), var(--accent-dim));
            color: var(--bg-primary);
        }
        
        .file-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
            animation: fadeIn 0.6s ease-out 0.3s both;
        }
        
        .file-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            position: relative;
        }
        
        .file-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        
        .file-card.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.2);
        }
        
        .file-card-preview {
            width: 100%;
            aspect-ratio: 1;
            position: relative;
            background: var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .file-card-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .file-card-checkbox {
            position: absolute;
            top: 0.75rem;
            left: 0.75rem;
            z-index: 10;
        }
        
        .file-card-index {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            background: rgba(0, 0, 0, 0.7);
            color: var(--text-primary);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            z-index: 10;
        }
        
        .file-card-info {
            padding: 1rem;
        }
        
        .file-card-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            margin-bottom: 0.75rem;
            word-break: break-word;
            min-height: 2.4em;
            line-height: 1.2;
        }
        
        .file-card-name.renamed {
            color: var(--success);
        }
        
        .file-card-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        
        .file-icon-large {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-dim), var(--accent));
            color: var(--bg-primary);
        }
        
        .checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--accent);
        }
        
        .arrow-btns {
            display: flex;
            gap: 0.25rem;
            flex: 1;
        }
        
        .arrow-btn {
            flex: 1;
            height: 32px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            font-size: 1rem;
        }
        
        .arrow-btn:hover:not(:disabled) {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }
        
        .arrow-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .rename-section {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border-top: 2px solid var(--accent);
            padding: 0.75rem 1.5rem;
            z-index: 100;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.4s ease-out;
        }
        
        .rename-section-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }
        
        .rename-section-spacer {
            height: 80px;
        }
        
        .rename-section h3 {
            font-size: 0.9rem;
            color: var(--accent);
            margin: 0;
            white-space: nowrap;
        }
        
        .rename-input-group {
            display: flex;
            gap: 0.5rem;
            flex: 1;
            min-width: 300px;
        }
        
        .rename-input {
            flex: 1;
            padding: 0.5rem 0.75rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.3s ease;
        }
        
        .rename-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.1);
        }
        
        .preview-text {
            padding: 0.5rem 0.75rem;
            background: var(--bg-tertiary);
            border-radius: 6px;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            border: 1px solid var(--border);
            flex: 1;
            min-width: 250px;
        }
        
        .preview-text strong {
            color: var(--accent-bright);
        }
        
        .stats {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        .stat {
            display: flex;
            align-items: baseline;
            gap: 0.35rem;
        }
        
        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        
        .stat-value {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
        }
        
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }
        
        .empty-state svg {
            width: 120px;
            height: 120px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .download-section {
            text-align: center;
            animation: fadeIn 0.6s ease-out 0.5s both;
        }
        
        .btn-large {
            padding: 1rem 2rem;
            font-size: 1.1rem;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 1200px) {
            .file-list {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 1.5rem;
            }
            
            .app-container {
                padding: 1rem;
            }
            
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .file-list {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }
            
            .rename-section {
                padding: 0.75rem;
            }
            
            .rename-section-inner {
                flex-direction: column;
                align-items: stretch;
                gap: 0.75rem;
            }
            
            .stats {
                justify-content: space-between;
            }
            
            .rename-input-group, .preview-text {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef, memo } = React;
        
        function FileRenamer() {
            const [files, setFiles] = useState([]);
            const [selectedIds, setSelectedIds] = useState(new Set());
            const [sortMode, setSortMode] = useState('date');
            const [sortDirection, setSortDirection] = useState('desc');
            const [renameInput, setRenameInput] = useState('');
            
            const fileInputRef = useRef(null);
            const folderInputRef = useRef(null);
            const previewCache = useRef({});
            
            // Handle file upload
            const handleFileUpload = (fileList) => {
                const newFiles = Array.from(fileList).map((file, index) => {
                    const nameParts = file.name.split('.');
                    const extension = nameParts.length > 1 ? '.' + nameParts.pop() : '';
                    const nameWithoutExt = nameParts.join('.');
                    
                    return {
                        id: `file-${Date.now()}-${index}`,
                        originalFile: file,
                        originalName: file.name,
                        currentName: file.name,
                        nameWithoutExt: nameWithoutExt,
                        extension: extension,
                        size: file.size,
                        dateModified: file.lastModified,
                        isRenamed: false,
                        order: files.length + index
                    };
                });
                
                setFiles([...files, ...newFiles]);
            };
            
            // Sort files
            const getSortedFiles = () => {
                let sorted = [...files];
                
                if (sortMode === 'name') {
                    sorted.sort((a, b) => {
                        const nameA = a.currentName.toLowerCase();
                        const nameB = b.currentName.toLowerCase();
                        return sortDirection === 'asc' 
                            ? nameA.localeCompare(nameB)
                            : nameB.localeCompare(nameA);
                    });
                } else if (sortMode === 'date') {
                    sorted.sort((a, b) => {
                        return sortDirection === 'asc'
                            ? a.dateModified - b.dateModified
                            : b.dateModified - a.dateModified;
                    });
                } else if (sortMode === 'custom') {
                    sorted.sort((a, b) => a.order - b.order);
                }
                
                return sorted;
            };
            
            // Handle sort mode change
            const handleSort = (mode) => {
                if (sortMode === mode) {
                    setSortDirection(sortDirection === 'asc' ? 'desc' : 'asc');
                } else {
                    setSortMode(mode);
                    setSortDirection(mode === 'date' ? 'desc' : 'asc');
                }
            };
            
            // Selection handlers
            const toggleSelection = (id) => {
                const newSelected = new Set(selectedIds);
                if (newSelected.has(id)) {
                    newSelected.delete(id);
                } else {
                    newSelected.add(id);
                }
                setSelectedIds(newSelected);
            };
            
            const selectAll = () => {
                setSelectedIds(new Set(files.map(f => f.id)));
            };
            
            const deselectAll = () => {
                setSelectedIds(new Set());
            };
            
            // Rename files
            const handleRename = () => {
                if (!renameInput.trim() || selectedIds.size === 0) return;
                
                const sanitized = renameInput.replace(/[<>:"/\\|?*]/g, '');
                const selectedFiles = files.filter(f => selectedIds.has(f.id));
                const sortedSelected = getSortedFiles().filter(f => selectedIds.has(f.id));
                
                const updatedFiles = files.map(file => {
                    const selectedIndex = sortedSelected.findIndex(f => f.id === file.id);
                    if (selectedIndex !== -1) {
                        const newName = selectedIds.size === 1
                            ? `${sanitized}${file.extension}`
                            : `${sanitized} (${selectedIndex + 1})${file.extension}`;
                        
                        return {
                            ...file,
                            currentName: newName,
                            nameWithoutExt: selectedIds.size === 1 ? sanitized : `${sanitized} (${selectedIndex + 1})`,
                            isRenamed: true
                        };
                    }
                    return file;
                });
                
                setFiles(updatedFiles);
                setRenameInput('');
            };
            
            // Manual reordering
            const moveFile = (id, direction) => {
                if (sortMode !== 'custom') {
                    setSortMode('custom');
                }
                
                const currentFiles = getSortedFiles();
                const index = currentFiles.findIndex(f => f.id === id);
                if (index === -1) return;
                
                const newIndex = direction === 'left' ? index - 1 : index + 1;
                if (newIndex < 0 || newIndex >= currentFiles.length) return;
                
                const reordered = [...currentFiles];
                [reordered[index], reordered[newIndex]] = [reordered[newIndex], reordered[index]];
                
                const updatedFiles = reordered.map((file, idx) => ({
                    ...file,
                    order: idx
                }));
                
                setFiles(updatedFiles);
            };
            
            // Download selected files as ZIP
            const downloadSelected = async () => {
                const selectedFiles = files.filter(f => selectedIds.has(f.id));
                
                if (selectedFiles.length === 0) return;
                
                const zip = new JSZip();
                
                selectedFiles.forEach(file => {
                    zip.file(file.currentName, file.originalFile);
                });
                
                const content = await zip.generateAsync({ type: 'blob' });
                const url = URL.createObjectURL(content);
                const a = document.createElement('a');
                a.href = url;
                a.download = `renamed-files-${Date.now()}.zip`;
                a.click();
                URL.revokeObjectURL(url);
            };
            
            // Generate preview
            const getPreview = () => {
                if (selectedIds.size === 0 || !renameInput.trim()) {
                    return 'Select files and enter a name to see preview';
                }
                
                const sanitized = renameInput.replace(/[<>:"/\\|?*]/g, '');
                const sortedSelected = getSortedFiles().filter(f => selectedIds.has(f.id));
                
                if (selectedIds.size === 1) {
                    const file = sortedSelected[0];
                    return `${sanitized}${file.extension}`;
                }
                
                const previews = sortedSelected.slice(0, 3).map((file, idx) => 
                    `${sanitized} (${idx + 1})${file.extension}`
                );
                
                if (sortedSelected.length > 3) {
                    previews.push(`... and ${sortedSelected.length - 3} more`);
                }
                
                return previews.join(', ');
            };
            
            // Create image preview with caching to prevent re-loading
            const FilePreview = ({ file }) => {
                const [preview, setPreview] = useState(previewCache.current[file.id] || null);
                
                useEffect(() => {
                    // If already cached, use it
                    if (previewCache.current[file.id]) {
                        setPreview(previewCache.current[file.id]);
                        return;
                    }
                    
                    // Otherwise, load the image
                    if (file.originalFile.type.startsWith('image/')) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const url = e.target.result;
                            previewCache.current[file.id] = url;
                            setPreview(url);
                        };
                        reader.readAsDataURL(file.originalFile);
                    }
                }, [file.id]);
                
                if (preview) {
                    return <img src={preview} alt={file.currentName} />;
                }
                
                const ext = file.extension.toUpperCase().replace('.', '') || '?';
                return <div className="file-icon-large">{ext}</div>;
            };
            
            const sortedFiles = getSortedFiles();
            
            return (
                <div className="app-container">
                    <header>
                        <div className="header-title">
                            <h1>File Renamer</h1>
                            <p className="subtitle">Batch rename files with precision and ease</p>
                        </div>
                        <div className="upload-buttons">
                            <button className="btn btn-primary" onClick={() => fileInputRef.current?.click()}>
                                📄 Select Files
                            </button>
                            <button className="btn btn-secondary" onClick={() => folderInputRef.current?.click()}>
                                📂 Select Folder
                            </button>
                        </div>
                    </header>
                    
                    <input 
                        ref={fileInputRef}
                        type="file" 
                        multiple 
                        onChange={(e) => handleFileUpload(e.target.files)}
                    />
                    <input 
                        ref={folderInputRef}
                        type="file" 
                        webkitdirectory="true"
                        directory="true"
                        multiple
                        onChange={(e) => handleFileUpload(e.target.files)}
                    />
                    
                    {files.length > 0 && (
                        <>
                            <div className="controls">
                                <div className="controls-group">
                                    <span style={{color: 'var(--text-secondary)'}}>Sort:</span>
                                    <button 
                                        className="btn btn-secondary"
                                        onClick={() => handleSort('name')}
                                    >
                                        Name {sortMode === 'name' && (sortDirection === 'asc' ? '↑' : '↓')}
                                    </button>
                                    <button 
                                        className="btn btn-secondary"
                                        onClick={() => handleSort('date')}
                                    >
                                        Date {sortMode === 'date' && (sortDirection === 'asc' ? '↑' : '↓')}
                                    </button>
                                    <span className={`sort-badge ${sortMode === 'custom' ? 'active' : ''}`}>
                                        {sortMode === 'custom' ? '✓ Custom Order' : 'Custom'}
                                    </span>
                                </div>
                                
                                <div className="controls-group">
                                    <button className="btn btn-secondary" onClick={selectAll}>
                                        Select All
                                    </button>
                                    <button className="btn btn-secondary" onClick={deselectAll}>
                                        Deselect All
                                    </button>
                                    <span style={{color: 'var(--accent)'}}>
                                        {selectedIds.size} selected
                                    </span>
                                </div>
                            </div>
                            
                            <div className="file-list">
                                {sortedFiles.map((file, index) => (
                                    <div 
                                        key={file.id}
                                        className={`file-card ${selectedIds.has(file.id) ? 'selected' : ''}`}
                                    >
                                        <div className="file-card-preview">
                                            <input 
                                                type="checkbox"
                                                className="checkbox file-card-checkbox"
                                                checked={selectedIds.has(file.id)}
                                                onChange={() => toggleSelection(file.id)}
                                            />
                                            <div className="file-card-index">{index + 1}</div>
                                            <FilePreview file={file} />
                                        </div>
                                        
                                        <div className="file-card-info">
                                            <div className={`file-card-name ${file.isRenamed ? 'renamed' : ''}`}>
                                                {file.currentName}
                                            </div>
                                            
                                            <div className="file-card-actions">
                                                <div className="arrow-btns">
                                                    <button 
                                                        className="arrow-btn"
                                                        onClick={() => moveFile(file.id, 'left')}
                                                        disabled={index === 0}
                                                        title="Move left"
                                                    >
                                                        ←
                                                    </button>
                                                    <button 
                                                        className="arrow-btn"
                                                        onClick={() => moveFile(file.id, 'right')}
                                                        disabled={index === sortedFiles.length - 1}
                                                        title="Move right"
                                                    >
                                                        →
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            
                            <div className="rename-section-spacer"></div>
                            
                            <div className="rename-section">
                                <div className="rename-section-inner">
                                    <h3>Rename</h3>
                                    
                                    <div className="stats">
                                        <div className="stat">
                                            <div className="stat-label">Total:</div>
                                            <div className="stat-value">{files.length}</div>
                                        </div>
                                        <div className="stat">
                                            <div className="stat-label">Selected:</div>
                                            <div className="stat-value">{selectedIds.size}</div>
                                        </div>
                                        <div className="stat">
                                            <div className="stat-label">Renamed:</div>
                                            <div className="stat-value">{files.filter(f => f.isRenamed).length}</div>
                                        </div>
                                    </div>
                                    
                                    <div className="rename-input-group">
                                        <input 
                                            type="text"
                                            className="rename-input"
                                            placeholder="Enter new filename..."
                                            value={renameInput}
                                            onChange={(e) => setRenameInput(e.target.value)}
                                            onKeyPress={(e) => {
                                                if (e.key === 'Enter') handleRename();
                                            }}
                                        />
                                        <button 
                                            className="btn btn-primary"
                                            onClick={handleRename}
                                            disabled={!renameInput.trim() || selectedIds.size === 0}
                                            style={{padding: '0.5rem 1rem'}}
                                        >
                                            Rename
                                        </button>
                                    </div>
                                    
                                    <div className="preview-text">
                                        <strong>Preview:</strong> {getPreview()}
                                    </div>
                                    
                                    <button 
                                        className="btn btn-primary"
                                        onClick={downloadSelected}
                                        disabled={selectedIds.size === 0}
                                        style={{padding: '0.5rem 1rem', whiteSpace: 'nowrap'}}
                                    >
                                        📦 Download Selected ({selectedIds.size})
                                    </button>
                                </div>
                            </div>
                        </>
                    )}
                    
                    {files.length === 0 && (
                        <div className="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                                <polyline points="13 2 13 9 20 9"></polyline>
                            </svg>
                            <h3>No files uploaded yet</h3>
                            <p>Upload files or folders to get started</p>
                        </div>
                    )}
                </div>
            );
        }
        
        ReactDOM.render(<FileRenamer />, document.getElementById('root'));
    </script>
</body>
</html>
