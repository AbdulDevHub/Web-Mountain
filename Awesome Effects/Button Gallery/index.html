<!doctype html>
<html>
  <head>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.css"
    />
    <title>Cool Button Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400;0,800;1,200&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="gallery-container">
      <h1 class="gallery-title">Cool Button Gallery</h1>

      <div class="button-grid">
        <!-- Original Gradient Border Button -->
        <div class="button-item">
          <div class="button-border">
            <button type="button" class="button">Start Coding!</button>
          </div>
          <p class="button-label">Gradient Border</p>
        </div>

        <!-- Neon Glow Button -->
        <div class="button-item">
          <button type="button" class="button neon-button">Neon Glow</button>
          <p class="button-label">Neon Effect</p>
        </div>

        <!-- 3D Push Button -->
        <div class="button-item">
          <button type="button" class="button push-button">Push Me</button>
          <p class="button-label">3D Push</p>
        </div>

        <!-- Liquid Fill Button -->
        <div class="button-item">
          <button type="button" class="button liquid-button">
            <span>Fill Up</span>
          </button>
          <p class="button-label">Liquid Fill</p>
        </div>

        <!-- Glitch Button -->
        <div class="button-item">
          <button type="button" class="button glitch-button" data-text="GLITCH">
            GLITCH
          </button>
          <p class="button-label">Glitch Effect</p>
        </div>

        <!-- Shimmer Button -->
        <div class="button-item">
          <button type="button" class="button shimmer-button">Shimmer</button>
          <p class="button-label">Shimmer Shine</p>
        </div>

        <!-- Pulse Border Button -->
        <div class="button-item">
          <button type="button" class="button pulse-button">Pulse Wave</button>
          <p class="button-label">Pulse Border</p>
        </div>

        <!-- Flip Button -->
        <div class="button-item">
          <div class="flip-button">
            <button type="button" class="button flip-front">Hover Me</button>
            <button type="button" class="button flip-back">Flipped!</button>
          </div>
          <p class="button-label">3D Flip</p>
        </div>

        <!-- Slide Button -->
        <div class="button-item">
          <button type="button" class="button slide-button">
            <span>Slide →</span>
          </button>
          <p class="button-label">Slide Effect</p>
        </div>
      </div>
    </div>
  </body>
</html>
