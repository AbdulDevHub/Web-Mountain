<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Web Mountain</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="Favicon.png" />

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #e5e7eb;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #020617, var(--bg));
      color: var(--text);
      padding: 3rem 1.5rem;
      min-height: 100vh;
    }

    h1 {
      font-size: clamp(2rem, 4vw, 3rem);
      text-align: center;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    .filter-tabs {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 3rem;
      padding: 0 1rem;
    }

    .filter-btn {
      background: var(--card);
      border: 1px solid rgba(56, 189, 248, 0.2);
      color: var(--text);
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .filter-btn:hover {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }

    .filter-btn.active {
      background: var(--accent);
      color: #020617;
      border-color: var(--accent);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .bento-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    .project-card {
      display: block;
      text-decoration: none;
      background: var(--card);
      border-radius: 12px;
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.05);
      transition: all 0.3s ease;
      overflow: hidden;
      position: relative;
    }

    .project-card:hover {
      border-color: var(--accent);
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(56,189,248,0.25);
    }

    .project-card.hidden {
      display: none;
    }

    .project-image {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      display: block;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    }

    .project-info {
      padding: 1rem 1.25rem;
    }

    .project-name {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .project-category {
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    footer {
      margin-top: 4rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    /* Featured project styles - make some stand out */
    .project-card.featured {
      grid-column: span 2;
    }

    @media (max-width: 768px) {
      .project-card.featured {
        grid-column: span 1;
      }

      .filter-tabs {
        gap: 0.5rem;
      }

      .filter-btn {
        padding: 0.5rem 1rem;
        font-size: 0.85rem;
      }
    }

    /*----------------Text Selection----------*/
    ::selection {
      background: #38bdf8; /* WebKit/Blink Browsers */
      color: #ffffff;
    }

    ::-moz-selection {
      background: #38bdf8; /* Gecko Browsers */
      color: #ffffff;
    }

    ::-ms-selection {
      background: #38bdf8; /* IE 10+ */
      color: #ffffff;
    }

    /*----------------Scrollbar----------*/
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
      transition: 1s;
    }

    ::-webkit-scrollbar-thumb {
      background-color: #38bdf8;
      background-clip: padding-box;
      border: 2px solid transparent;
      border-radius: 5px;
      transition: 1s;
    }

    ::-webkit-scrollbar-thumb:vertical:hover,
    ::-webkit-scrollbar-thumb:horizontal:hover {
      background-color: #38bdf8;
      transition: 0.3s;
    }

    ::-webkit-scrollbar-track {
      background-color: #020617;
    }

    ::-webkit-scrollbar-thumb:vertical:active,
    ::-webkit-scrollbar-thumb:horizontal:active {
      background: #38bdf8;
    }

    ::-webkit-scrollbar-corner {
      background: none;
    }
  </style>
</head>
<body>

  <h1>🏔️ Web Mountain</h1>
  <p class="subtitle">A personal collection of frontend experiments, UI concepts, and mini apps</p>

  <div class="filter-tabs">
    <button class="filter-btn active" data-category="all">All Projects</button>
    <button class="filter-btn" data-category="websites">Awesome Websites</button>
    <button class="filter-btn" data-category="ui">UI Experiments</button>
    <button class="filter-btn" data-category="effects">Awesome Effects</button>
    <button class="filter-btn" data-category="extensions">Chrome Extensions</button>
  </div>

  <div class="container">
    <div class="bento-grid" id="projectGrid"></div>
  </div>

  <footer>
    Built as a living archive of frontend learning & experiments.
  </footer>

  <script>
    const CATEGORY_LABELS = {
      websites: "Awesome Websites",
      ui: "UI Experiments",
      effects: "Awesome Effects",
      extensions: "Chrome Extensions",
    };

    async function loadProjects() {
      const response = await fetch("projects.json");
      const projects = await response.json();
      renderProjects(projects);
      initFilters();
    }

    function renderProjects(projects) {
      const grid = document.getElementById("projectGrid");

      grid.innerHTML = projects.map(project => `
        <a class="project-card${project.featured ? " featured" : ""}"
           data-category="${project.category}"
           href="${project.href}">
          <img class="project-image"
               src="${project.image}"
               alt="${project.name} preview"
               loading="lazy">
          <div class="project-info">
            <div class="project-name">${project.name}</div>
            <div class="project-category">${CATEGORY_LABELS[project.category] ?? project.category}</div>
          </div>
        </a>
      `).join("");
    }

    function initFilters() {
      const filterButtons = document.querySelectorAll(".filter-btn");
      const projectGrid = document.getElementById("projectGrid");

      filterButtons.forEach(button => {
        button.addEventListener("click", () => {
          const category = button.dataset.category;

          filterButtons.forEach(btn => btn.classList.remove("active"));
          button.classList.add("active");

          projectGrid.querySelectorAll(".project-card").forEach(card => {
            const matches = category === "all" || card.dataset.category === category;
            card.classList.toggle("hidden", !matches);
          });
        });
      });
    }

    loadProjects();
  </script>

</body>
</html>
